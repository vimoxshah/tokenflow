name: Pages

# Deploys site/index.html to GitHub Pages on every push to main.
#
# One-time repo setting: Settings → Pages → Source: "GitHub Actions".
# Live at https://vimoxshah.github.io/tokenflow/

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # upload-pages-artifact takes a single directory; stage site + media into it
      - name: Stage site with screenshots
        run: |
          mkdir -p _pages/docs
          cp -R site/. _pages/
          cp -R docs/media _pages/docs/media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4

concurrency:
  group: pages
  cancel-in-progress: true
