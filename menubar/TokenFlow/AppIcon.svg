<?xml version="1.0" encoding="UTF-8"?>
<!-- TokenFlow app icon: dark rounded square, gradient chart mark (matches dashboard brand) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9dff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <!-- macOS squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <!-- subtle inner highlight -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>
  <!-- rising token-usage line -->
  <polyline points="224,704 400,540 520,620 800,300"
            fill="none" stroke="url(#line)" stroke-width="72"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- end dot -->
  <circle cx="800" cy="300" r="52" fill="#5eead4"/>
  <!-- baseline -->
  <line x1="224" y1="784" x2="800" y2="784" stroke="#ffffff" stroke-opacity="0.35"
        stroke-width="28" stroke-linecap="round"/>
</svg>
