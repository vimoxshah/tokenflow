<?xml version="1.0" encoding="UTF-8"?>
<!-- TokenFlow app icon: blue→purple gradient squircle with white lightning bolt,
     matching the in-app header and landing-page mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <!-- subtle top gloss for depth -->
  <rect x="64" y="64" width="896" height="448" rx="204" fill="url(#gloss)"/>
  <!-- inner hairline highlight -->
  <rect x="70" y="70" width="884" height="884" rx="198" fill="none"
        stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
  <!-- white lightning bolt -->
  <path filter="url(#boltShadow)"
        d="M576 176 L340 560 L492 560 L448 848 L700 448 L540 448 Z"
        fill="#ffffff"/>
</svg>
