# TokenFlow team server reverse proxy, nginx equivalent of deploy/Caddyfile,
# for teams that already run nginx and manage their own certificates (for
# example with certbot). See docs/team-server.md for the full guide.
#
# This is a SITE config, meant to live inside nginx's existing http{} block
# (drop it at /etc/nginx/conf.d/tokenflow-team.conf, or sites-available/ on
# a distro that uses that layout, and reload nginx). It is not a full
# nginx.conf and will not validate on its own outside that block.
#
# client_max_body_size matters here: the rollup upload cap is 8 MB (see
# src/commands/team-serve.js), and nginx's own default is 1 MB. Without the
# line below, a legitimate push gets a 413 from nginx itself, before it ever
# reaches TokenFlow.

# ---- Variant (a): LAN only, everything behind the proxy (ACTIVE) ----------
server {
	listen 443 ssl;
	server_name team.example.com;

	ssl_certificate     /etc/letsencrypt/live/team.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/team.example.com/privkey.pem;

	client_max_body_size 9m;

	location / {
		proxy_pass http://127.0.0.1:7790;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

