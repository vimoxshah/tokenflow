name: 'TokenFlow receipt comment'
description: >-
  Reads the TokenFlow receipt attached to a pull request's head commit as a
  git note (refs/notes/tokenflow), posts or updates it as one PR comment, and
  optionally fails the job when the receipt is over a declared budget - the
  status check that lets this action gate a merge. Makes no network call
  beyond the GitHub API; reads no prompt or code content.
branding:
  icon: 'file-text'
  color: 'purple'

inputs:
  token:
    description: 'GitHub token used to read/write the PR comment.'
    required: false
    default: ${{ github.token }}
  notes-ref:
    description: 'The git notes ref the receipt was written to.'
    required: false
    default: 'tokenflow'
  comment-marker:
    description: 'HTML comment used to find the existing receipt comment to update, instead of posting a new one every push.'
    required: false
    default: '<!-- tokenflow-receipt -->'
  max-usd:
    description: 'Cap on receipt.costUsd, in US dollars. Empty means: read the cap from policy-file instead.'
    required: false
    default: ''
  max-usd-per-100-lines:
    description: 'Cap on receipt.costPer100Lines, in US dollars. Empty means: read the cap from policy-file instead.'
    required: false
    default: ''
  fail-on-over-budget:
    description: 'When a declared cap is exceeded, fail the job (exit code 1) instead of only reporting it.'
    required: false
    default: 'true'
  policy-file:
    description: 'Path, relative to the checkout, to a policy file declaring receipt.maxCostUsd / receipt.maxCostPer100Lines. Read only when the matching input above is empty. A missing or malformed file means no cap.'
    required: false
    default: '.tokenflow/policy.yaml'

outputs:
  cost-usd:
    description: 'The receipt costUsd used for the budget check, or empty when the receipt has no priced turns.'
  over-budget:
    description: '"true" when any declared cap was exceeded, else "false".'
  verdict:
    description: 'The budget verdict as one line of text (also the first line of the PR comment and step summary).'

runs:
  using: 'node20'
  main: 'action/index.js'
